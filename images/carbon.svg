<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- a conversation: incoming outlined, outgoing filled, the way the app draws it -->

  <!-- them: tail on the bottom left -->
  <path d="M 248,96 H 612 A 18,18 0 0 1 630,114 V 158 A 18,18 0 0 1 612,176 H 236 A 6,6 0 0 1 230,170 V 114 A 18,18 0 0 1 248,96 Z"
        fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="256" y="118" width="300" height="9" rx="4.5" fill="#8a8a85" opacity="0.55"/>
  <rect x="256" y="140" width="228" height="9" rx="4.5" fill="#8a8a85" opacity="0.35"/>

  <!-- you: tail on the bottom right, in the app's own teal -->
  <path d="M 588,190 H 952 A 18,18 0 0 1 970,208 V 264 A 6,6 0 0 1 964,270 H 588 A 18,18 0 0 1 570,252 V 208 A 18,18 0 0 1 588,190 Z"
        fill="#17887A"/>
  <rect x="596" y="212" width="312" height="9" rx="4.5" fill="#f2fffb" opacity="0.85"/>
  <rect x="596" y="234" width="214" height="9" rx="4.5" fill="#f2fffb" opacity="0.55"/>
  <text x="964" y="292" font-family="monospace" font-size="12" fill="#8a8a85" text-anchor="end" letter-spacing="1">OPENED 9:41 AM</text>

  <!-- the subject line, demoted to a break in the stream -->
  <rect x="462" y="306" width="276" height="30" rx="15" fill="#121212" stroke="#2a2a2a" stroke-width="2"/>
  <text x="600" y="326" font-family="monospace" font-size="11" fill="#8a8a85" text-anchor="middle" letter-spacing="2">NEW SUBJECT</text>

  <!-- them again -->
  <path d="M 248,358 H 512 A 18,18 0 0 1 530,376 V 404 A 18,18 0 0 1 512,422 H 236 A 6,6 0 0 1 230,416 V 376 A 18,18 0 0 1 248,358 Z"
        fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="256" y="380" width="196" height="9" rx="4.5" fill="#8a8a85" opacity="0.55"/>

  <text x="600" y="500" font-family="'Archivo Black', sans-serif" font-size="52" fill="#f5f5f0" text-anchor="middle" letter-spacing="1">CARBON</text>
  <text x="600" y="535" font-family="monospace" font-size="14" fill="#8a8a85" text-anchor="middle" letter-spacing="2">EMAIL, READ AS CONVERSATION</text>
</svg>
