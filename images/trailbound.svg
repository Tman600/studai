<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- terminal window chrome -->
  <rect x="80" y="80" width="1040" height="515" fill="#121212" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="80" y="80" width="1040" height="42" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="112" cy="101" r="6" fill="#55554f"/>
  <circle cx="136" cy="101" r="6" fill="#55554f"/>
  <circle cx="160" cy="101" r="6" fill="#55554f"/>
  <text x="600" y="107" font-family="monospace" font-size="14" fill="#8a8a85" text-anchor="middle">trailbound — freeplay</text>

  <!-- terminal text lines -->
  <g font-family="monospace" font-size="17" fill="#8a8a85">
    <text x="112" y="165">&gt; You reach the ridge as the fog begins to lift.</text>
    <text x="112" y="196" fill="#f5f5f0">&gt; The valley below holds three paths forward.</text>
    <text x="112" y="227">&gt; [1] Follow the river north</text>
    <text x="112" y="255">&gt; [2] Cut through the old pine stand</text>
    <text x="112" y="283">&gt; [3] Make camp and wait for daylight</text>
    <text x="112" y="330" fill="#55554f">&gt; journey: MOUNTAIN PASS   day 14   supplies: 62%</text>
  </g>

  <!-- cursor blink block -->
  <rect x="112" y="345" width="11" height="20" fill="#f5f5f0"/>

  <!-- ASCII-ish decoration -->
  <g font-family="monospace" font-size="15" fill="#2a2a2a">
    <text x="112" y="420">/\  /\      __</text>
    <text x="112" y="440">  \/  \____/  \___/\</text>
  </g>

  <text x="112" y="560" font-family="'Archivo Black', sans-serif" font-size="40" fill="#f5f5f0" letter-spacing="1">TRAILBOUND</text>
  <text x="112" y="590" font-family="monospace" font-size="14" fill="#8a8a85" letter-spacing="2">FIVE JOURNEYS. ONE TERMINAL. LOCAL AI STORYTELLING.</text>
</svg>
