<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- the sheen off a disc held under a lamp: bronze, violet, green -->
    <linearGradient id="om-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c47e42" stop-opacity="0.78"/>
      <stop offset="34%"  stop-color="#84489e" stop-opacity="0.66"/>
      <stop offset="62%"  stop-color="#348470" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#c47e42" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="om-gloss" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e2cdb2" stop-opacity="0.16"/>
      <stop offset="64%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="om-vig" cx="0.66" cy="0.46" r="0.62">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0a0a0a"/>

  <!-- the disc -->
  <g transform="translate(872 318)">
    <circle r="242" fill="#121212"/>
    <circle r="238" fill="url(#om-sheen)"/>
    <circle r="238" fill="url(#om-gloss)"/>
    <g fill="none" stroke="#0a0a0a" stroke-opacity="0.28">
      <circle r="214"/><circle r="188"/><circle r="162"/><circle r="136"/><circle r="110"/>
    </g>
    <circle r="86" fill="#121212"/>
    <circle r="86" fill="none" stroke="#2a2a2a"/>
    <circle r="56" fill="#0d0d0d" stroke="#2a2a2a"/>
    <circle r="36" fill="#0a0a0a" stroke="#2a2a2a"/>
    <circle r="242" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  </g>
  <rect width="1200" height="675" fill="url(#om-vig)"/>

  <!-- the front of the drive -->
  <g>
    <rect x="80" y="452" width="452" height="44" fill="#0e0e0e" stroke="#242424"/>
    <rect x="100" y="470" width="372" height="8" fill="#050505" stroke="#1c1c1c"/>
    <circle cx="502" cy="474" r="4" fill="#d8a13a" fill-opacity="0.85"/>
  </g>

  <text x="80" y="300" font-family="'Archivo Black', 'Arial Black', sans-serif" font-weight="900" font-size="96" letter-spacing="1">
    <tspan fill="#f5f5f0">OPTI-</tspan><tspan fill="#a8744b">MOLE</tspan>
  </text>

  <g font-family="monospace" fill="#8a8a85">
    <text x="84" y="356" font-size="19" letter-spacing="3">TWO TEAMS. TWENTY DVDS. ONE OF YOU IS LYING.</text>
    <text x="84" y="412" font-size="15" letter-spacing="2" fill="#55554f">THE DISCS HOLD NOTHING. THE DRIVE DECIDES.</text>
    <text x="84" y="545" font-size="14" letter-spacing="2" fill="#55554f">DISC 07 &#183; CLAIMED BY TEAM A &#183; 02:11</text>
  </g>

  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#2a2a2a" stroke-width="2"/>
</svg>
